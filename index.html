<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRISTINE PEARL PHARMA - Sales Return Manager</title>
  <link rel="icon" 
        href="https://www.pristinepearlpharma.in/images/alt-logo.png" 
        type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ── TOKENS ── */
    :root {
      font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
      --primary:       #0056b3;
      --primary-light: #007BFF;
      --green:         #217346;
      --orange:        #FF8904;
      --red:           #dc3545;
      --bg:            #eef2f7;
      --card:          #ffffff;
      --text:          #1e2a38;
      --muted:         #6c7a8d;
      --border:        #dde3ea;
      --section-bg:    #f4f7fb;
      --section-hd:    #e8edf4;
    }

    /* ── BASE ── */
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 80px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.09);
      padding: 0;
      max-width: 1540px;
      width: 98%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* ── PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 28px 16px;
      border-bottom: 2px solid var(--border);
      background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
      color: #fff;
    }
    .page-header img {
      height: 48px;
      width: auto;
      border-radius: 6px;
      background: #fff;
      padding: 4px;
      flex-shrink: 0;
    }
    .page-header-text h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .4px;
      color: #fff;
      border: none;
      padding: 0;
    }
    .page-header-text p {
      margin: 2px 0 0;
      font-size: 12px;
      opacity: .8;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    /* ── FORM CONTENT WRAPPER ── */
    .form-body { padding: 24px 28px; }

    /* ── SECTION GROUPS ── */
    .section-group {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .section-group-header {
      background: var(--section-hd);
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-group-header .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--primary-light);
      display: inline-block;
    }
    .section-group-body {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 16px;
    }
    @media(max-width:1000px){ .section-group-body { grid-template-columns: repeat(2,1fr); } }
    @media(max-width:600px){  .section-group-body { grid-template-columns: 1fr; } }

    /* ── LABELS & INPUTS ── */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input[type=text], input[type=date], input[type=number], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      font-size: 13.5px;
      color: var(--text);
      background: #fff;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(0,123,255,.12);
      outline: none;
    }
    select:disabled, input[readonly] {
      background: #f0f3f7;
      color: var(--muted);
      cursor: default;
    }
    textarea { resize: vertical; min-height: 60px; }

    /* ── SR REF BADGE ── */
    .sr-ref-badge {
      display: inline-block;
      background: linear-gradient(135deg, #0056b3, #007BFF);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 2px;
      box-shadow: 0 3px 8px rgba(0,86,179,.25);
      width: 100%;
      text-align: center;
    }

    /* ── PRODUCT TABLE SECTION ── */
    .table-section {
      background: var(--section-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .table-section-header {
      background: var(--section-hd);
      padding: 8px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .table-scroll-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 900px;
    }
    th {
      background: linear-gradient(135deg, #0056b3 0%, #003d82 100%);
      color: #fff;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .6px;
      text-transform: uppercase;
      padding: 11px 8px;
      white-space: nowrap;
      border-bottom: 2px solid #003270;
      position: sticky;
      top: 0;
    }
    td {
      padding: 8px 7px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      vertical-align: middle;
    }
    #itemsTable tbody tr:last-child td { border-bottom: none; }
    #itemsTable tbody tr:nth-child(even) td { background: #f7f9fc; }
    #itemsTable tbody tr:hover td { background: #eef4ff; transition: background .15s; }

    /* ── TABLE INPUTS ── */
    .item-row input, .item-row select {
      padding: 5px 7px;
      font-size: 12.5px;
      border-radius: 5px;
      border: 1.5px solid var(--border);
      background: #fff;
    }
    .item-row input[readonly] {
      font-weight: 700;
      background: #eef2f7;
      border: none;
      color: var(--text);
    }
    .item-row td:nth-child(1) { text-align: center; font-weight: 600; color: var(--muted); }
    .item-row td:nth-child(5),
    .item-row td:nth-child(6) { text-align: center; }
    .item-row td:nth-child(7),
    .item-row td:nth-child(8),
    .item-row td:nth-child(9),
    .item-row td:nth-child(10),
    .item-row td:nth-child(11) { text-align: right; }

    /* ── STATUS BADGES ── */
    .status-badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .status-badge.expired      { background: #fde8ea; color: #b91c2a; border: 1px solid #f5c2c7; }
    .status-badge.short-expiry { background: #fff3cd; color: #854d0e; border: 1px solid #fde68a; }
    .status-badge.long-expiry  { background: #d1fae5; color: #065f3a; border: 1px solid #6ee7b7; }
    .status-badge.empty        { background: #f1f5f9; color: var(--muted); border: 1px solid var(--border); }

    /* ── TABLE ACTIONS ROW ── */
    .table-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      background: var(--section-bg);
      border-top: 1px solid var(--border);
    }

    /* ── TOTAL BAR ── */
    .total-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 14px 20px;
      background: linear-gradient(135deg, #fff8e1, #fffde7);
      border: 1.5px solid #f9c74f;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .total-bar .total-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .total-bar .total-amount {
      font-size: 26px;
      font-weight: 900;
      color: #92400e;
      letter-spacing: 1px;
    }
    .total-bar .total-currency {
      font-size: 13px;
      font-weight: 600;
      color: #b45309;
      margin-right: -4px;
    }

    /* ── STICKY BOTTOM ACTION BAR ── */
    .bottom-action-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-top: 2px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,.1);
      padding: 12px 28px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: flex-end;
      z-index: 100;
    }

    /* ── BUTTONS ── */
    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: 0;
      background: var(--primary-light);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .3px;
      transition: background .18s, transform .1s, box-shadow .18s;
      box-shadow: 0 3px 6px rgba(0,123,255,.2);
      white-space: nowrap;
    }
    button:hover {
      background: var(--primary);
      transform: translateY(-1px);
      box-shadow: 0 5px 10px rgba(0,86,179,.28);
    }
    button:active { transform: translateY(0); }
    button.ghost {
      background: #fff;
      color: var(--muted);
      border: 1.5px solid var(--border);
      box-shadow: none;
    }
    button.ghost:hover { background: var(--section-hd); color: var(--text); transform: none; box-shadow: none; }
    .small { font-size: 12px; padding: 8px 14px; }
    .remove {
      background: var(--red);
      box-shadow: 0 3px 6px rgba(220,53,69,.2);
      padding: 5px 10px;
      font-size: 12px;
    }
    .remove:hover { background: #b91c2a; }

    #submitToSheet  { background: var(--orange) !important; box-shadow: 0 3px 8px rgba(255,137,4,.25) !important; }
    #submitToSheet:hover { background: #d97200 !important; }
    #downloadXlsx  { background: var(--green) !important; box-shadow: 0 3px 8px rgba(33,115,70,.25) !important; }
    #downloadXlsx:hover { background: #185a35 !important; }
    #generate      { background: #607346 !important; }
    #generate:hover{ background: #4b5c37 !important; }
    #sendMail      { background: var(--primary-light) !important; }
    #viewReport    { background: #6c42c4 !important; box-shadow: 0 3px 8px rgba(108,66,196,.25) !important; }
    #viewReport:hover { background: #5533a0 !important; }
    #addRow        { background: var(--green); box-shadow: 0 3px 8px rgba(33,115,70,.2); }
    #addRow:hover  { background: #185a35; }

    /* ── STATUS MESSAGE ── */
    .status-message {
      font-weight: 600;
      color: var(--orange);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ── LOADING SPINNER ── */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PRINT ── */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; top:0; left:0; width:100%; padding:10px; }
      .card { box-shadow:none; border-radius:0; padding:0; }
      #printContent p { font-size:11px !important; }
      #printContent table { border-radius:0; border:1px solid #333; font-size:10px !important; }
      #printContent th, #printContent td { padding:4px; border-color:#333; }
      #printContent th { background:#eee !important; color:#000 !important; }
      .bottom-action-bar { display: none; }
    }

    /* ── REPORT / PREVIEW STYLES ── */
    .result {
      margin-top: 25px;
      padding: 20px;
      background: #fcfcfd;
      border-radius: 10px;
      border: 2px dashed #c7deff;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.04);
    }
    .report-company-name {
      text-align:center; font-weight:700; font-size:26px; color:#000;
      margin-bottom:5px; text-transform:uppercase;
    }
    .report-title {
      text-align:center; font-weight:900; font-size:26px; color:var(--primary);
      margin:0 0 18px; padding-bottom:5px; border-bottom:1px solid #ddd; text-transform:uppercase;
    }
    .report-header {
      display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
      padding:12px; margin-bottom:20px; background:#f8f9fa;
      border-radius:8px; border:1px solid #eee;
    }
    .report-meta-item { font-size:13px; line-height:1.2; }
    .report-meta-item strong {
      color:var(--muted); font-weight:600; display:block;
      text-transform:uppercase; font-size:10px; margin-bottom:2px;
    }
    .report-table {
      margin-top:10px; border:1px solid var(--border) !important;
      border-collapse:collapse !important; border-radius:8px; overflow:hidden;
    }
    .report-table th, .report-table td { padding:8px 10px; font-size:12px; border:1px solid #eee; }
    .report-table th { background:var(--primary); color:#fff; font-weight:600; text-transform:uppercase; }
    .report-table tr:nth-child(even) { background-color:#f7f9fc; }
    .report-table tr:hover { background-color:#eef4ff; }
    .report-footer-total {
      text-align:right; font-size:17px; font-weight:700;
      padding:14px 20px; margin-top:18px;
      background:#eef4ff; border-top:3px solid var(--primary-light);
      border-radius:0 0 8px 8px;
    }
    .report-footer-total span { color:var(--primary); font-size:22px; margin-left:12px; }
  </style>

</head>
<body>
  <div class="card">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <img src="https://www.pristinepearlpharma.in/images/alt-logo.png" alt="Logo">
      <div class="page-header-text">
        <h1>Pristine Pearl Pharma Pvt Ltd</h1>
        <p>Sales Return Manager</p>
      </div>
      <div style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <div class="sr-ref-badge" id="memberID" style="width:auto;min-width:130px;">—</div>
      </div>
    </div>

    <div class="form-body">

      <!-- SECTION 1: Invoice & Stockist -->
      <div class="section-group">
        <div class="section-group-header"><span class="dot"></span> Invoice &amp; Stockist Details</div>
        <div class="section-group-body">

          <div>
            <label for="date">C.Inv Date</label>
            <input id="date" type="date">
          </div>
          <div>
            <label for="cInvNo">C.Inv No.</label>
            <input id="cInvNo" type="text" placeholder="Customer Inv. No." oninput="this.value=this.value.toUpperCase()">
          </div>
          <div>
            <label for="stockist">Stockist Name</label>
            <input type="text" id="stockistSearch" placeholder="🔍 Type to search stockist..." style="margin-bottom:5px;">
            <select id="stockist"><option value="">-- Loading stockists... --</option></select>
          </div>
          <div>
            <label for="stockistCode">Stockist Code</label>
            <input id="stockistCode" type="text" readonly>
          </div>
          <div>
            <label for="area">Area</label>
            <input id="area" type="text" readonly>
          </div>
          <div>
            <label for="team">State / Team</label>
            <input id="team" type="text" readonly>
          </div>
          <div>
            <label for="noOfBoxes">No. of Boxes</label>
            <input id="noOfBoxes" type="number" min="0" placeholder="Approx. boxes returned">
          </div>

          <!-- hidden nature field kept for data compatibility -->
          <div style="display:none">
            <select id="returnNature" disabled><option value="Sales Return">Sales Return</option></select>
          </div>

        </div>
      </div>

      <!-- SECTION 2: Courier Details -->
      <div class="section-group">
        <div class="section-group-header"><span class="dot"></span> Courier Details</div>
        <div class="section-group-body">
          <div>
            <label>Courier Name</label>
            <input type="text" id="courierName" placeholder="COURIER NAME" oninput="this.value=this.value.replace(/[^A-Z ]/gi,'').toUpperCase();">
          </div>
          <div>
            <label>POD No.</label>
            <input type="text" id="podNo" placeholder="POD / AWB NUMBER" oninput="this.value=this.value.toUpperCase();">
          </div>
          <!-- hidden memberID input kept for JS compatibility -->
          <input type="hidden" name="memberID" id="memberIDHidden">
        </div>
      </div>

      <!-- SECTION 3: Product Details Table -->
      <div class="table-section">
        <div class="table-section-header">
          <span><span class="dot"></span> Product Details</span>
          <span id="rowCountBadge" style="font-size:11px;font-weight:600;color:var(--muted);">0 items</span>
        </div>
        <div class="table-scroll-wrap">
          <table id="itemsTable">
            <thead>
              <tr>
                <th style="width:38px">S.No</th>
                <th style="width:210px">Product Name</th>
                <th style="width:90px">Batch</th>
                <th style="width:78px">Expiry</th>
                <th style="width:68px">Qty</th>
                <th style="width:68px">FQty</th>
                <th style="width:75px">Rate</th>
                <th style="width:62px">GST %</th>
                <th style="width:80px">GST Val</th>
                <th style="width:80px">Taxable</th>
                <th style="width:88px">Total</th>
                <th style="width:100px">Status</th>
                <th style="width:160px">Remarks</th>
                <th style="width:36px"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="table-actions">
          <button id="addRow">＋ Add Product</button>
          <button id="clearRows" class="ghost small">🗑 Clear All</button>
        </div>
      </div>

      <!-- TOTAL BAR -->
      <div class="total-bar">
        <span class="total-label">Grand Total Return Value</span>
        <span class="total-currency">₹</span>
        <span class="total-amount" id="totalValueDisplay">0.00</span>
      </div>

      <!-- PREVIEW AREA -->
      <div id="printArea"><div id="preview" class="result" hidden></div></div>

    </div><!-- /form-body -->
  </div><!-- /card -->

  <!-- STICKY BOTTOM ACTION BAR -->
  <div class="bottom-action-bar">
    <span id="uploadStatus" class="status-message" style="display:none;margin-right:auto;"></span>
    <button id="viewReport">📋 View Report</button>
    <button id="generate" style="display:none;">👁 Preview</button>
    <button id="sendMail" style="display:none;">✉ Send Mail</button>
    <button id="downloadXlsx" style="display:none;">⬇ Download Excel</button>
    <button id="submitToSheet">⬆ Upload</button>
  </div>
  <script>
    // ** IMPORTANT: Replace this with your actual Google Apps Script Web App URL **
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbziC3U1Yds6bbc6XkliQdpctIoajspM1upHOUFQ5_V9t0yIkSkuJt_XyaxXG1b6ac-H/exec';
    const stockistEl = document.getElementById('stockist');
    const submitBtn = document.getElementById('submitToSheet');
    const uploadStatus = document.getElementById('uploadStatus');
    const downloadXlsxBtn = document.getElementById('downloadXlsx');
    const sendMailBtn = document.getElementById('sendMail'); 
    const formFields = document.querySelectorAll('input, select, textarea');
    const totalValueDisplay = document.getElementById('totalValueDisplay');
    const returnNatureEl = document.getElementById('returnNature'); // New element reference
    stockistEl.addEventListener('change', (e)=>{
      const sel = stockistEl.selectedOptions[0];
      document.getElementById('stockistCode').value = sel ? sel.value : '';
      document.getElementById('area').value = sel ? sel.dataset.area || '' : '';
      document.getElementById('team').value = sel ? sel.dataset.team || '' : '';
    });

    /* ── FETCH STOCKIST LIST FROM GOOGLE SHEET ── */
    (function loadStockists() {
      const SHEET_ID = '1EYY6jkJ5DJ7RgRXhtVRmMtGwhso-0rDWXJpbISmFySU';
      const GID      = '0';
      const url      = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

      fetch(url)
        .then(r => { if (!r.ok) throw new Error('Network error'); return r.text(); })
        .then(csv => {
          const lines = csv.trim().split('\n');
          // first line is header: CODE,AREA,TEAM,NAME  — skip it
          const dataLines = lines.slice(1);

          stockistEl.innerHTML = '<option value="">-- Select Customer --</option>';

          dataLines.forEach(line => {
            // Handle quoted CSV fields
            const cols = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            const [code, area, team, name] = clean;
            if (!name) return;

            const opt = document.createElement('option');
            opt.value        = code  || '';
            opt.dataset.area = area  || '';
            opt.dataset.team = team  || '';
            opt.textContent  = name;
            stockistEl.appendChild(opt);
          });

          // Refresh the originalOptions used by search
          if (window._rebuildSearchOptions) window._rebuildSearchOptions();
        })
        .catch(err => {
          stockistEl.innerHTML = '<option value="">-- Failed to load stockists --</option>';
          console.error('Stockist fetch error:', err);
        });
    })();

    /* ── FETCH PRODUCT LIST FROM GOOGLE SHEET ── */
    let products = []; // populated async on load

    (function loadProducts() {
      const SHEET_ID = '1VVOiZHQSurf7tMa0p8TTcNy44qKvkOg7vR1v9VFqnyU';
      const GID      = '0';
      const url      = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;

      fetch(url)
        .then(r => { if (!r.ok) throw new Error('Network error'); return r.text(); })
        .then(csv => {
          const lines = csv.trim().split('\n').slice(1); // skip header row
          products = lines

    function generatePlainTextReport(data) {
        if (!data) return "";
        const { rows, cInvDate, cInvNo, stockistName, stockistCode, area, team, noOfBoxes, grandTotal, returnNature, memberID } = data;
        
        let plainText = `PRISTINE PEARL PHARMA PVT LTD - SALES RETURN REPORT\n\n`;
        plainText += `Stockist: ${stockistName} (${stockistCode})\n`;
        plainText += `Area / Team: ${area} / ${team}\n`;
        plainText += `C.Inv Date: ${cInvDate}\nC.Inv No.: ${cInvNo}\n`;
        plainText += `Nature: ${returnNature}\n`; // Include Nature here
        plainText += `No. of Boxes: ${noOfBoxes || 'N/A'}\n\n--- PRODUCT DETAILS ---\n\n`;

        rows.forEach((r, i) => {
            const expFormatted = r.expiry || ''; // FIX 4: Directly use r.expiry (e.g., "12/25")
            plainText += `--- Item ${i + 1} ---\n`;
            plainText += `Product: ${r.prod}\n`;
            plainText += `Batch/Expiry: ${r.batch} / ${expFormatted}\n`;
            plainText += `Details: ${r.qty} x ${r.rate} | Taxable: ${r.taxableValue} | GST@${r.gstPercent}%: ${r.gstValue}\n`;

        plainText += '------------------------\n';
        plainText += `TOTAL RETURN VALUE: ${grandTotal}\n\n`;
        plainText += `Report Generated: ${new Date().toLocaleString()}`;

        return encodeURIComponent(plainText);
    }

<script>
const searchInput = document.getElementById("stockistSearch");
const stockistSelect = document.getElementById("stockist");

// originalOptions rebuilt after async fetch
let originalOptions = Array.from(stockistSelect.options);

// Called by the fetch routine once options are populated
window._rebuildSearchOptions = function () {
  originalOptions = Array.from(stockistSelect.options);
};

searchInput.addEventListener("input", function () {
  const keyword = this.value.toLowerCase();
  stockistSelect.innerHTML = "";

  originalOptions.forEach(opt => {
    if (opt.text.toLowerCase().includes(keyword) || opt.value === "") {
      stockistSelect.appendChild(opt.cloneNode(true));
    }
  });

  // Expand dropdown while typing
  stockistSelect.size = Math.min(8, stockistSelect.options.length);
});

// Collapse dropdown after selection
stockistSelect.addEventListener("change", () => {
  stockistSelect.size = 1;
});

// Auto collapse when leaving search
searchInput.addEventListener("blur", () => {
  setTimeout(() => stockistSelect.size = 1, 200);
});

/* ===============================
   AUTO SAVE DRAFT (POWER CUT SAFE)
   =============================== */

function saveDraft() {
  const draft = {
    date: document.getElementById("date")?.value || "",
    cInvNo: document.getElementById("cInvNo")?.value || "",
    stockist: document.getElementById("stockist")?.value || "",
    items: []
  };

  document.querySelectorAll("#itemsTable tbody tr").forEach(row => {
    draft.items.push({
      item: row.querySelector(".itemName")?.value || "",
      batch: row.querySelector(".batch")?.value || "",
      qty: row.querySelector(".qty")?.value || "",
      rate: row.querySelector(".rate")?.value || "",
      reason: (function() {
        const sel = row.querySelector('.remarks-select');
        const txt = row.querySelector('.remarks-other-text');
        if (!sel) return '';
        return sel.value === 'Others' ? (txt ? txt.value.trim() : '') : (sel.value || '');
      })()
    });
  });

  localStorage.setItem("SR_DRAFT", JSON.stringify(draft));
}

// Auto-save every 3 seconds
setInterval(saveDraft, 3000);


/* ===============================
   RESTORE DRAFT AFTER RESTART
   =============================== */
window.addEventListener("load", () => {
  const draft = localStorage.getItem("SR_DRAFT");
  if (!draft) return;

  if (confirm(" ⚠ Unsaved Sales Return found. Restore?")) {
    const data = JSON.parse(draft);

    document.getElementById("date").value = data.date || "";
    document.getElementById("cInvNo").value = data.cInvNo || "";

    // ✅ FIX STARTS HERE
    const stockistEl = document.getElementById("stockist");
    stockistEl.value = data.stockist;
    stockistEl.dispatchEvent(new Event("change"));
    // ✅ FIX ENDS HERE

    // Clear rows once
    itemsTable.innerHTML = "";

    // Restore products
    data.items.forEach(item => {
      newRow(item);
    });
    updateRowCountBadge();
  }
});


/* ===============================
   CLEAR DRAFT AFTER SUCCESS SAVE
   =============================== */
function clearDraft() {
  localStorage.removeItem("SR_DRAFT");
}

</script>
